kind = "mobile"
previewPath = "/mobile/"
title = "Kanz Bakery Mobile"
version = "1.0.0"
id = "artifacts/kanz-bakery-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 22007

[services.development]
run = "pnpm --filter @workspace/kanz-bakery-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kanz-bakery-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/kanz-bakery-mobile", "run", "serve" ]

[services.env]
PORT = "22007"
BASE_PATH = "/mobile/"
